<section  class="container-carrinho"></section>
<h1>Carrinho</h1>
@if (carrinhoFacade.carrinhoVazio()){ 
    <p>Seu carrinho está vazio.</p>
    <button mat-raised-button color="primary" routerLink="/produtos">Ver produtos</button>
 }@else {
    <section class="lista-carrinho">
        @for (item of carrinhoFacade.itens(); track $index){
            <article class="item-carrinho">
                <div>
                    <p><strong>{{item.nome}}</strong></p>
                    <p>{{item.preco |precoFormatado}}</p>
                    <button mat-stroked-button color="warn"
                    type="button"
                 (click)="removerItem($index)">Remover</button>

                </div>
            </article>
        }
    </section>
 }
 <section class="resumo-carrinho">
    <p>Itens no carrinho: <strong>{{carrinhoFacade.quantidade()}}</strong></p>
    <p>Total: <strong>{{carrinhoFacade.total()|precoFormatado}}</strong></p>
 </section>
 <section class="acoes-carrinho">
 <button mat-button type="button" (click)="limparCarrinho()">limpar Carrinho</button>
 <button mat-button type="button" routerLink="/produtos">Continuar Comprando</button>
 <button class="acoes-carrinho-confirmar" mat-button type="button"routerLink="/checkout">Finalizar Compra</button>
 <button class="acoes-carrinho-cancelar" mat-button type="button" (click)="CancelarCompra()">cancelar Compra</button>
 </section>
